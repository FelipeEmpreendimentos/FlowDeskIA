databases:
  - name: flowdeskia-db-staging-va
    plan: free
    region: virginia
    postgresMajorVersion: "17"

services:
  - type: web
    name: flowdeskia-api-staging
    runtime: python
    plan: free
    region: virginia
    branch: staging
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowdeskia-db-staging-va
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: SQL_ECHO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "500"
