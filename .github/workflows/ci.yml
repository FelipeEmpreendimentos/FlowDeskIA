name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Validar sintaxe Python
        run: python -m compileall -q app scripts tests

      - name: Validar imports da aplicação
        env:
          DB_NAME: flowdesk_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: flowdesk-ci-secret-with-more-than-thirty-two-characters
        run: python -m scripts.check_imports

      - name: Executar testes
        env:
          DB_NAME: flowdesk_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: flowdesk-ci-secret-with-more-than-thirty-two-characters
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build
